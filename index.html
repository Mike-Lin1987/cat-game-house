<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="貓咪方格是一款可完全離線遊玩的區域邏輯填格遊戲。"
    >
    <title>貓咪方格</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/packs.js" defer></script>
    <script src="js/core.js" defer></script>
    <script src="js/levels.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-cat" viewBox="0 0 64 64">
        <path d="M13 24 10 7l14 9a30 30 0 0 1 16 0l14-9-3 17c5 5 8 11 8 18 0 12-12 19-27 19S5 54 5 42c0-7 3-13 8-18Z" fill="var(--cat-fur, #45322d)"/>
        <path d="m14 12 9 7-8 5Z" fill="var(--cat-ear, #f69a88)"/>
        <path d="m50 12-9 7 8 5Z" fill="var(--cat-ear, #f69a88)"/>
        <path d="M32 18c8 0 15 3 19 8v17c0 9-9 14-19 14S13 52 13 43V26c4-5 11-8 19-8Z" fill="var(--cat-face, #fff8ee)"/>
        <path d="M13 26c4-5 11-8 19-8v19c-8 1-14-2-19-7Z" fill="var(--cat-patch, #45322d)"/>
        <ellipse cx="24" cy="37" rx="3.5" ry="4.5" fill="#2e2421"/>
        <ellipse cx="41" cy="37" rx="3.5" ry="4.5" fill="#2e2421"/>
        <circle cx="25" cy="35.5" r="1" fill="#fff"/>
        <circle cx="42" cy="35.5" r="1" fill="#fff"/>
        <path d="m32 42-3 2 3 2 3-2Z" fill="#ef7d79"/>
        <path d="M32 46c-2 3-5 3-7 1m7-1c2 3 5 3 7 1" fill="none" stroke="#7c5048" stroke-linecap="round" stroke-width="1.5"/>
        <path d="M22 44 8 41m14 7L7 49m35-5 14-3m-14 7 15 1" fill="none" stroke="#7c5048" stroke-linecap="round" stroke-width="1.5"/>
      </symbol>
      <symbol id="icon-paw" viewBox="0 0 48 48">
        <ellipse cx="24" cy="31" rx="13" ry="10" fill="currentColor"/>
        <ellipse cx="10" cy="22" rx="5" ry="7" fill="currentColor"/>
        <ellipse cx="20" cy="12" rx="5" ry="7" fill="currentColor"/>
        <ellipse cx="30" cy="12" rx="5" ry="7" fill="currentColor"/>
        <ellipse cx="39" cy="22" rx="5" ry="7" fill="currentColor"/>
      </symbol>
      <symbol id="icon-fish" viewBox="0 0 48 48">
        <path d="M7 24c8-10 19-13 29-5l8-7v24l-8-7C26 37 15 34 7 24Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="3"/>
        <circle cx="31" cy="22" r="2" fill="currentColor"/>
        <path d="m13 18 7 12m0-16 7 18" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <symbol id="icon-yarn" viewBox="0 0 48 48">
        <circle cx="23" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M9 18c11 4 20 11 25 20M14 11c9 8 18 12 25 13M8 28c10-1 19-7 26-16M26 39c5 5 10 5 15 1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"/>
      </symbol>
      <symbol id="icon-undo" viewBox="0 0 48 48">
        <path d="m18 12-9 9 9 9M10 21h19c8 0 12 5 12 12 0 5-3 9-7 11" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
      <symbol id="icon-replay" viewBox="0 0 48 48">
        <path d="M39 18A16 16 0 1 0 40 30M39 8v10H29" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 48 48">
        <rect x="7" y="7" width="34" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M18 8v32M30 8v32M8 18h32M8 30h32" stroke="currentColor" stroke-width="2.5"/>
      </symbol>
      <symbol id="icon-gear" viewBox="0 0 48 48">
        <path d="m28 5 2 6 5 2 6-2 4 7-5 4v5l5 4-4 7-6-2-5 2-2 6h-8l-2-6-5-2-6 2-4-7 5-4v-5l-5-4 4-7 6 2 5-2 2-6Z" fill="currentColor"/>
        <circle cx="24" cy="24" r="7" fill="#fffaf2"/>
      </symbol>
      <symbol id="icon-back" viewBox="0 0 48 48">
        <path d="M29 9 14 24l15 15M15 24h25" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M24 13v12l8 5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="3"/>
      </symbol>
      <symbol id="icon-book" viewBox="0 0 48 48">
        <path d="M6 10c7-2 13 0 18 5v27c-5-5-11-7-18-5Zm36 0c-7-2-13 0-18 5v27c5-5 11-7 18-5Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="3"/>
      </symbol>
      <symbol id="icon-close" viewBox="0 0 48 48">
        <path d="m12 12 24 24m0-24L12 36" stroke="currentColor" stroke-linecap="round" stroke-width="4"/>
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 48 48">
        <path d="m14 19 10 10 10-10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
      <symbol id="icon-star" viewBox="0 0 48 48">
        <path d="m24 4 6 13 14 2-10 10 3 14-13-7-13 7 3-14L4 19l14-2Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="2"/>
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 48 48">
        <rect x="9" y="20" width="30" height="23" rx="6" fill="currentColor"/>
        <path d="M16 21v-6a8 8 0 0 1 16 0v6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4"/>
        <circle cx="24" cy="31" r="3" fill="#fffaf2"/>
        <path d="M24 33v4" stroke="#fffaf2" stroke-linecap="round" stroke-width="2.5"/>
      </symbol>
    </svg>

    <main id="app" aria-busy="true"></main>

    <div id="live-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <dialog id="settings-dialog" class="game-dialog">
      <form method="dialog" class="dialog-card">
        <div class="dialog-heading">
          <div>
            <p class="dialog-kicker">遊戲偏好</p>
            <h2>設定</h2>
          </div>
          <button class="icon-button dialog-close" value="close" aria-label="關閉設定">
            <span data-static-icon="close"></span>
          </button>
        </div>
        <label class="setting-row">
          <span>
            <strong>自動檢查</strong>
            <small>立即標示互相衝突的貓咪</small>
          </span>
          <input id="setting-auto-check" type="checkbox">
        </label>
        <label class="setting-row">
          <span>
            <strong>動畫效果</strong>
            <small>顯示落子、提示與完成動畫</small>
          </span>
          <input id="setting-animations" type="checkbox">
        </label>
        <button id="reset-progress-button" class="danger-button" type="button">
          重設全部進度
        </button>
      </form>
    </dialog>

    <dialog id="confirm-dialog" class="game-dialog">
      <form method="dialog" class="dialog-card compact-dialog">
        <div class="dialog-heading">
          <div>
            <p id="confirm-kicker" class="dialog-kicker">請確認</p>
            <h2 id="confirm-title">要重新開始嗎？</h2>
          </div>
          <button class="icon-button dialog-close" value="cancel" aria-label="取消">
            <span data-static-icon="close"></span>
          </button>
        </div>
        <p id="confirm-message" class="dialog-message"></p>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel">取消</button>
          <button id="confirm-primary" class="primary-button" value="confirm">
            確認
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="completion-dialog" class="game-dialog completion-dialog">
      <form method="dialog" class="dialog-card completion-card">
        <button class="icon-button dialog-close completion-close" value="close" aria-label="關閉完成視窗">
          <span data-static-icon="close"></span>
        </button>
        <span class="completion-cat" data-static-cat></span>
        <p class="dialog-kicker">呼嚕！漂亮解開了</p>
        <h2>關卡完成</h2>
        <div id="completion-stars" class="completion-stars" aria-label="獲得星級"></div>
        <dl class="result-list">
          <div><dt>使用時間</dt><dd id="result-time">00:00</dd></div>
          <div><dt>操作步數</dt><dd id="result-moves">0</dd></div>
          <div><dt>提示次數</dt><dd id="result-hints">0</dd></div>
        </dl>
        <p id="unlock-message" class="unlock-message"></p>
        <div class="completion-actions">
          <button id="completion-next" class="primary-button" value="next">下一關</button>
          <button class="secondary-button" value="replay">再玩一次</button>
          <button class="tertiary-button" value="select">返回選關</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
