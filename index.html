<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9ef">
    <meta
      name="description"
      content="遊戲小屋收錄可離線遊玩的單機網頁遊戲，從這裡選一款喜歡的遊戲開始挑戰。"
    >
    <title>遊戲小屋</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./portal.css">
    <script src="./js/game-catalog.js" defer></script>
    <script src="./js/progress-backup.js" defer></script>
    <script src="./js/portal.js" defer></script>
    <script src="./js/progress-ui.js" defer></script>
    <script src="./js/pwa.js" data-service-worker="./service-worker.js" defer></script>
  </head>
  <body>
    <svg class="portal-sprite" aria-hidden="true">
      <symbol id="portal-paw" viewBox="0 0 48 48">
        <ellipse cx="24" cy="31" rx="13" ry="10" fill="currentColor"/>
        <ellipse cx="10" cy="22" rx="5" ry="7" fill="currentColor"/>
        <ellipse cx="20" cy="12" rx="5" ry="7" fill="currentColor"/>
        <ellipse cx="30" cy="12" rx="5" ry="7" fill="currentColor"/>
        <ellipse cx="39" cy="22" rx="5" ry="7" fill="currentColor"/>
      </symbol>
      <symbol id="portal-download" viewBox="0 0 48 48">
        <path d="M24 7v23m-9-9 9 9 9-9M9 38h30" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
      <symbol id="portal-arrow" viewBox="0 0 48 48">
        <path d="M9 24h28m-9-9 9 9-9 9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
      <symbol id="portal-play" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="m20 16 13 8-13 8Z" fill="currentColor"/>
      </symbol>
      <symbol id="portal-backup" viewBox="0 0 48 48">
        <path d="M24 7v22m-9-9 9 9 9-9M9 34v7h30v-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
      <symbol id="portal-restore" viewBox="0 0 48 48">
        <path d="M24 41V19m-9 9 9-9 9 9M9 14V7h30v7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
      </symbol>
    </svg>

    <div class="portal-shell">
      <header class="portal-header">
        <a class="portal-brand" href="./" aria-label="遊戲小屋首頁">
          <img src="./assets/icons/icon.svg" alt="" width="60" height="60">
          <span>遊戲小屋</span>
        </a>
        <button class="install-button" type="button" data-install-app>
          <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#portal-download"></use></svg>
          <span>安裝到手機</span>
        </button>
      </header>

      <main>
        <section class="portal-intro" aria-labelledby="portal-heading">
          <p class="portal-kicker">
            <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#portal-paw"></use></svg>
            離線也能玩的療癒小遊戲
          </p>
          <h1 id="portal-heading">選擇遊戲</h1>
          <p>挑一款喜歡的遊戲，隨時開始挑戰。</p>
        </section>

        <section class="progress-keeper" aria-labelledby="progress-heading">
          <div class="progress-keeper-copy">
            <span class="progress-keeper-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><use href="#portal-backup"></use></svg>
            </span>
            <div>
              <h2 id="progress-heading">保護遊戲進度</h2>
              <p>重新安裝前先備份，之後即可離線還原兩款遊戲的進度。</p>
            </div>
          </div>
          <div class="progress-keeper-controls">
            <div class="progress-actions">
              <button class="progress-button is-primary" type="button" data-backup-progress>
                <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#portal-backup"></use></svg>
                <span>備份進度</span>
              </button>
              <button class="progress-button" type="button" data-restore-progress>
                <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#portal-restore"></use></svg>
                <span>還原進度</span>
              </button>
              <input
                class="progress-file-input"
                type="file"
                accept="application/json,.json"
                data-progress-file
                aria-label="選擇遊戲進度備份檔"
              >
            </div>
            <p class="progress-status" data-progress-status role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="game-catalog" aria-label="遊戲列表">
          <div id="game-list" class="game-list">
            <noscript>
              <article class="game-card">
                <img class="game-cover" src="./assets/game-covers/cat-grid.svg" alt="">
                <div class="game-card-body">
                  <div class="game-title-row">
                    <h2>貓咪方格</h2>
                    <a class="tutorial-link" href="./tutorials/cat-grid/index.html">教學影片</a>
                  </div>
                  <p>在每列、每欄與每個彩色區域放入一隻貓咪</p>
                  <a class="play-link" href="./games/cat-grid/index.html">開始遊戲</a>
                </div>
              </article>
            </noscript>
          </div>
          <aside class="coming-soon">
            <span aria-hidden="true">🧶</span>
            <div>
              <strong>更多遊戲陸續加入</strong>
              <p>以後新增的遊戲會直接出現在這裡。</p>
            </div>
          </aside>
        </section>
      </main>

      <footer class="portal-footer">
        <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#portal-paw"></use></svg>
        <span>進度儲存在這台裝置，也可以備份後帶走</span>
      </footer>
    </div>

    <dialog id="install-dialog" class="install-dialog">
      <form method="dialog">
        <button class="dialog-close" value="close" aria-label="關閉">×</button>
        <img src="./assets/icons/icon.svg" alt="" width="78" height="78">
        <p class="portal-kicker">像 App 一樣開啟</p>
        <h2>安裝遊戲小屋</h2>
        <div data-install-content>
          <p><strong>iPhone／iPad：</strong>用 Safari 開啟後，點「分享」再選「加入主畫面」。</p>
          <p><strong>Android：</strong>用 Chrome 開啟後，點選單再選「安裝應用程式」或「新增至主畫面」。</p>
        </div>
        <button class="dialog-primary" value="close">知道了</button>
      </form>
    </dialog>

    <dialog id="restore-dialog" class="install-dialog progress-dialog">
      <form method="dialog">
        <button class="dialog-close" value="cancel" aria-label="關閉">×</button>
        <span class="dialog-progress-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><use href="#portal-restore"></use></svg>
        </span>
        <p class="portal-kicker">進度保護</p>
        <h2>還原遊戲進度</h2>
        <p class="restore-summary" data-restore-summary></p>
        <p class="restore-warning">這會覆蓋此裝置中相同遊戲的目前進度。</p>
        <div class="dialog-actions">
          <button class="dialog-secondary" value="cancel">先不要</button>
          <button class="dialog-primary" type="button" data-confirm-restore>確認還原</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
