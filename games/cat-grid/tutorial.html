<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff9ef">
    <meta name="description" content="貓咪方格繁體中文離線教學影片。">
    <title>貓咪方格｜教學影片</title>
    <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../assets/tutorials/tutorial.css">
    <script src="../../js/tutorial-page.js" defer></script>
  </head>
  <body style="--accent:#f17f63;--accent-dark:#a34b3b">
    <div class="tutorial-shell">
      <header class="tutorial-header">
        <a class="portal-link" href="../../index.html" data-portal-home>
          <img src="../../assets/icons/icon.svg" alt="">
          <span>返回遊戲小屋</span>
        </a>
        <a class="game-link" href="./index.html" data-game-home>返回遊戲</a>
      </header>
      <main class="tutorial-main">
        <div class="tutorial-heading">
          <p>快速上手</p>
          <h1>貓咪方格教學</h1>
          <p class="summary">看懂放置規則與 0.5 秒雙擊操作，再開始挑戰 100 關。</p>
        </div>
        <div class="video-frame">
          <video controls playsinline preload="metadata" poster="../../assets/game-covers/cat-grid.svg">
            <source src="./tutorial.webm" type="video/webm">
            您的瀏覽器不支援 WebM 影片，請使用下方連結下載觀看。
          </video>
        </div>
        <p class="video-note">影片含繁體中文字幕，無旁白；可離線播放。</p>
        <ol class="tutorial-steps">
          <li>每列、每欄與每個彩色區域各放一隻貓咪。</li>
          <li>點一下標記 X，0.5 秒內再點同一格放置貓咪。</li>
          <li>貓咪之間不能水平、垂直或斜角接觸。</li>
          <li>全部規則同時成立，關卡就完成。</li>
        </ol>
        <div class="tutorial-actions">
          <a class="primary-action" href="./index.html" data-game-home>開始遊戲</a>
          <a class="download-action" href="./tutorial.webm" download>下載教學影片</a>
        </div>
      </main>
    </div>
  </body>
</html>
