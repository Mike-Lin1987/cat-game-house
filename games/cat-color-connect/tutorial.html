<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9fffa">
    <meta name="description" content="貓咪彩色連線繁體中文離線教學影片。">
    <title>貓咪彩色連線｜教學影片</title>
    <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../assets/tutorials/tutorial.css">
    <script src="../../js/tutorial-page.js" defer></script>
  </head>
  <body style="--accent:#118a83;--accent-dark:#086861">
    <div class="tutorial-shell">
      <header class="tutorial-header">
        <a class="portal-link" href="../../index.html" data-portal-home>
          <img src="../../assets/icons/icon.svg" alt="">
          <span>返回遊戲小屋</span>
        </a>
        <a class="game-link" href="./index.html" data-game-home>返回遊戲</a>
      </header>
      <main class="tutorial-main">
        <div class="tutorial-heading">
          <p>快速上手</p>
          <h1>貓咪彩色連線教學</h1>
          <p class="summary">學會拖曳、避開碰撞與回退修正，再把彩色路線填滿棋盤。</p>
        </div>
        <div class="video-frame">
          <video controls playsinline preload="metadata" poster="../../assets/game-covers/cat-color-connect.svg">
            <source src="./tutorial.webm" type="video/webm">
            您的瀏覽器不支援 WebM 影片，請使用下方連結下載觀看。
          </video>
        </div>
        <p class="video-note">影片含繁體中文字幕，無旁白；可離線播放。</p>
        <ol class="tutorial-steps">
          <li>從一隻貓咪拖曳到相同顏色與符號的貓咪。</li>
          <li>路線不可交叉、重疊或經過其他端點。</li>
          <li>拖回路線前方的格子，可以自然回退修改。</li>
          <li>連完所有配對並填滿棋盤即可過關。</li>
        </ol>
        <div class="tutorial-actions">
          <a class="primary-action" href="./index.html" data-game-home>開始遊戲</a>
          <a class="download-action" href="./tutorial.webm" download>下載教學影片</a>
        </div>
      </main>
    </div>
  </body>
