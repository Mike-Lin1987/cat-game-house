<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>貓咪快遞員 · 關卡審核</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/review.css">
</head>
<body class="review-body">
  <main class="review-shell">
    <header class="review-header">
      <div>
        <p class="eyebrow">固定關卡資料審核</p>
        <h1>貓咪快遞員 · L001～L100</h1>
      </div>
      <nav><a href="index.html">開啟遊戲</a><a href="../../">回到遊戲小屋</a></nav>
    </header>
    <section class="review-controls" aria-label="關卡篩選">
      <label>搜尋 ID<input id="review-search" type="search" value="L001" autocomplete="off"></label>
      <label>章節<select id="review-chapter"><option value="">全部</option><option value="1">第一章</option><option value="2">第二章</option><option value="3">第三章</option><option value="4">第四章</option><option value="5">第五章</option></select></label>
      <label>地圖尺寸<select id="review-size"><option value="">全部</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
      <label>配送站<select id="review-stops"><option value="">全部</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
      <button id="review-solution" type="button" aria-pressed="false">顯示答案</button>
      <button id="review-play" type="button">逐格播放</button>
    </section>
    <div class="review-nav">
      <button id="review-prev" type="button">上一關</button>
      <strong id="review-position"></strong>
      <button id="review-next" type="button">下一關</button>
    </div>
    <section id="review-content"></section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/data/levels-001-020.js"></script>
  <script src="js/data/levels-021-040.js"></script>
  <script src="js/data/levels-041-060.js"></script>
  <script src="js/data/levels-061-080.js"></script>
  <script src="js/data/levels-081-100.js"></script>
  <script src="js/data/levels-index.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
