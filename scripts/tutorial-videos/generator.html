<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>教學影片產生器</title>
    <style>
      body { margin: 0; padding: 24px; color: #2f2926; background: #f4efe8; font-family: "Microsoft JhengHei", system-ui, sans-serif; }
      main { width: min(100%, 1280px); margin: auto; }
      canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 20px; background: #fff; box-shadow: 0 16px 45px rgb(70 45 32 / 18%); }
      .controls { display: flex; margin-top: 18px; align-items: center; flex-wrap: wrap; gap: 12px; }
      button { min-height: 46px; padding: 8px 18px; border: 0; border-radius: 14px; color: #fff; background: #9f5947; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .5; cursor: wait; }
      output { font-weight: 800; }
      .video-result { display: grid; margin-top: 18px; grid-template-columns: minmax(0, 480px) auto; align-items: center; gap: 16px; }
      .video-result[hidden] { display: none; }
      .video-result video { display: block; width: 100%; border-radius: 16px; background: #2f2926; box-shadow: 0 10px 28px rgb(70 45 32 / 16%); }
      .video-result a { justify-self: start; padding: 12px 18px; border-radius: 14px; color: #fff; background: #4d91a8; font-weight: 800; text-decoration: none; }
      @media (max-width: 720px) { .video-result { grid-template-columns: 1fr; } }
    </style>
    <script src="./generator.js" defer></script>
  </head>
  <body>
    <main>
      <canvas width="1280" height="720" aria-label="教學影片畫面預覽"></canvas>
      <div class="controls">
        <button type="button" data-render="cat-grid">產生貓咪方格影片</button>
        <button type="button" data-render="cat-color-connect">產生彩色連線影片</button>
        <button type="button" data-render="cat-word-solitaire">產生分類接龍影片</button>
        <button type="button" data-render="cat-milk-pipes">產生鮮奶管線影片</button>
        <button type="button" data-render="cat-storage-master">產生收納大師影片</button>
        <button type="button" data-render="cat-triple-match">產生三層配對影片</button>
        <output>準備完成</output>
      </div>
      <div class="video-result" data-video-result hidden>
        <video data-video-preview controls playsinline preload="metadata"></video>
        <a data-video-download download>下載剛產生的 WebM</a>
      </div>
    </main>
  </body>
</html>
