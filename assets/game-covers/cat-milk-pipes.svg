<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">貓咪鮮奶管線封面</title>
  <desc id="desc">溫暖的奶油木框送奶站裡，鮮奶從玻璃奶瓶沿著發光管線送到三隻不同毛色的貓咪</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff4dc"/>
      <stop offset=".48" stop-color="#e8bf88"/>
      <stop offset="1" stop-color="#c98f58"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f8e6c8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset=".5" stop-color="#dff4fb" stop-opacity=".88"/>
      <stop offset="1" stop-color="#a7d7e7" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f3fb"/>
    </linearGradient>
    <linearGradient id="blueMetal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8fd2e6"/>
      <stop offset=".5" stop-color="#4a94b2"/>
      <stop offset="1" stop-color="#27647d"/>
    </linearGradient>
    <linearGradient id="titleRibbon" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccebf5"/>
    </linearGradient>
    <linearGradient id="coralBowl" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffc4ae"/>
      <stop offset="1" stop-color="#df7968"/>
    </linearGradient>
    <linearGradient id="sageBowl" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d7e6b7"/>
      <stop offset="1" stop-color="#8dae78"/>
    </linearGradient>
    <linearGradient id="goldBowl" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe6a5"/>
      <stop offset="1" stop-color="#e6a84f"/>
    </linearGradient>
    <pattern id="pawPattern" width="72" height="72" patternUnits="userSpaceOnUse">
      <g fill="#c89561" opacity=".12" transform="translate(12 14) rotate(-12)">
        <ellipse cx="13" cy="20" rx="10" ry="8"/>
        <circle cx="3" cy="7" r="4"/>
        <circle cx="12" cy="3" r="4"/>
        <circle cx="22" cy="7" r="4"/>
      </g>
    </pattern>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#6a4227" flood-opacity=".28"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#62432f" flood-opacity=".24"/>
    </filter>
    <filter id="milkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="460" rx="38" fill="#f6e7cf"/>
  <g filter="url(#outerShadow)">
    <rect x="9" y="9" width="702" height="442" rx="34" fill="url(#frame)" stroke="#9b6941" stroke-width="4"/>
    <rect x="24" y="24" width="672" height="412" rx="25" fill="url(#panel)" stroke="#fff6e5" stroke-width="5"/>
    <rect x="31" y="31" width="658" height="398" rx="20" fill="url(#pawPattern)" stroke="#d1a16e" stroke-width="2"/>
  </g>

