      <g><rect x="132" y="286" width="45" height="39" rx="9" fill="#fff6df"/><use href="#animal-cat" x="140" y="288" width="29" height="29"/></g>
      <g><rect x="186" y="286" width="45" height="39" rx="9" fill="#fff6df"/><use href="#animal-cat" x="194" y="288" width="29" height="29"/></g>
      <rect x="240" y="286" width="45" height="39" rx="9" fill="#f3d4a8"/><rect x="294" y="286" width="45" height="39" rx="9" fill="#f3d4a8"/>
      <rect x="348" y="286" width="45" height="39" rx="9" fill="#f3d4a8"/><rect x="402" y="286" width="45" height="39" rx="9" fill="#f3d4a8"/>
      <rect x="456" y="286" width="45" height="39" rx="9" fill="#f3d4a8"/><rect x="510" y="286" width="45" height="39" rx="9" fill="#f3d4a8"/>
