<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">貓咪三層配對動物版</title>
  <desc id="desc">奶油木質房間中，貓咪、狗狗、兔子與狐狸卡牌層層堆疊，下方是九格暫存槽。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffaf0"/><stop offset=".56" stop-color="#f8e4bd"/><stop offset="1" stop-color="#edbd7e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e9aa68"/><stop offset="1" stop-color="#bb6c3d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf5"/><stop offset="1" stop-color="#f5dfb7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#6b351e" flood-opacity=".28"/>
    </filter>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#5e2d1a" flood-opacity=".34"/>
    </filter>

