  <rect width="640" height="360" rx="34" fill="url(#background)"/>
  <circle cx="574" cy="30" r="102" fill="#fff" opacity=".34"/>
  <path d="M0 278h640v82H0z" fill="url(#wood)"/>
  <path d="M0 301h640M0 333h640" stroke="#a95f36" stroke-width="3" opacity=".55"/>
  <path d="M32 40c18-18 44-22 64-7-24 1-40 14-48 36-6-10-11-20-16-29Z" fill="#a9b876" opacity=".42"/>

  <g filter="url(#card-shadow)">
    <g transform="translate(195 38) rotate(5 58 58)">
      <rect width="116" height="116" rx="22" fill="url(#card)" stroke="#9a5b35" stroke-width="6"/><rect x="9" y="9" width="98" height="98" rx="17" fill="#f7c676" opacity=".28"/>
      <use href="#animal-dog" x="23" y="22" width="70" height="70"/>
    </g>
    <g transform="translate(130 72) rotate(-4 58 58)">
      <rect width="116" height="116" rx="22" fill="url(#card)" stroke="#9a5b35" stroke-width="6"/><rect x="9" y="9" width="98" height="98" rx="17" fill="#f3aaa8" opacity=".2"/>
      <use href="#animal-rabbit" x="23" y="19" width="70" height="70"/>
    </g>
    <g transform="translate(65 112)">
      <rect width="122" height="122" rx="23" fill="url(#card)" stroke="#784329" stroke-width="7"/><rect x="10" y="10" width="102" height="102" rx="17" fill="#8a9dac" opacity=".16"/>
      <use href="#animal-cat" x="25" y="24" width="72" height="72"/><text x="61" y="107" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="12" font-weight="800" fill="#6a4938">貓咪</text>
    </g>
    <g transform="translate(257 111) rotate(3 58 58)">
      <rect width="116" height="116" rx="22" fill="url(#card)" stroke="#784329" stroke-width="7"/><rect x="9" y="9" width="98" height="98" rx="17" fill="#f28a3f" opacity=".16"/>
      <use href="#animal-fox" x="23" y="22" width="70" height="70"/><text x="58" y="102" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="12" font-weight="800" fill="#6a4938">狐狸</text>
    </g>
  </g>

  <g font-family="Microsoft JhengHei,sans-serif" text-anchor="end">
    <text x="594" y="91" font-size="34" font-weight="900" fill="#6d3d27">貓咪</text>
    <text x="594" y="134" font-size="34" font-weight="900" fill="#bd693b">三層配對</text>
    <rect x="421" y="151" width="173" height="35" rx="17.5" fill="#fff8e8" stroke="#d5995f" stroke-width="2"/>
    <text x="578" y="175" font-size="17" font-weight="800" fill="#7b4c32">三張相同動物</text>
    <text x="594" y="211" font-size="14" font-weight="700" fill="#8d674f">層層解鎖・輕鬆消除</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="61" y="271" width="518" height="70" rx="23" fill="#8b4f30" stroke="#6f3b25" stroke-width="5"/><rect x="70" y="280" width="500" height="51" rx="15" fill="#ca7d47"/>
    <g stroke="#6f3b25" stroke-width="2.5">
