          <p class="summary">看圖辨音，從兩個選項中找出正確注音；一路收集小魚、開寶箱，完成 100 關尋寶旅程。</p>

        <ol class="tutorial-steps">
          <li>先看題目圖片或圖示，也可以按喇叭再聽一次題目。</li>
          <li>從兩個注音選項中選出正確答案；答錯可以立即再試。</li>
          <li>每答對一題會獲得一條小魚，每五條小魚解鎖一件貓咪裝飾。</li>
          <li>每十關會顯示章節成果，完成第 100 關就能成為注音尋寶達人。</li>
          <li>遊戲會自動保存進度，回到遊戲小屋後也能繼續上次的關卡。</li>
