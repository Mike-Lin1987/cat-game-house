          <h1>貓咪鮮奶管線教學</h1>
          <p class="summary">旋轉每段管線，把鮮奶送到所有貓咪碗；完整網路不能洩漏、斷線或形成迴圈。</p>

            您的瀏覽器不支援 WebM 影片，請使用下方連結下載觀看。

        <p class="video-note">影片含繁體中文字幕，無旁白；可離線播放。</p>
        <ol class="tutorial-steps">
          <li>點一下可旋轉的管線，讓它順時針轉 90 度；固定格與鮮奶槽不會旋轉。</li>
          <li>白色鮮奶脈流代表已從鮮奶槽接通；紅橘小水滴表示接口仍在洩漏。</li>
          <li>全部有效管線都要接上，所有貓咪碗都要收到鮮奶。</li>
          <li>完整網路必須是一棵樹；即使全部接通，形成迴圈也不能過關。</li>
          <li>提示只指出一格方向錯誤的管線，不會代替你旋轉。</li>
          <li>復原也計算一步；想重新整理整盤時可使用「重玩」。</li>
        </ol>
