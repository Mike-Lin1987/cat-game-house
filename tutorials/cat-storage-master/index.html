        <p class="summary">拖曳、旋轉與翻面每件貓咪用品，讓所有拼塊完整填滿木製收納箱。</p>

      <ol class="tutorial-steps">
        <li>從待放拼塊區拖曳用品，木箱中的綠色輪廓表示可以吸附放置。</li>
        <li>先選取拼塊，再使用「旋轉」；第三章起，部分拼塊也能水平翻面。</li>

        <li>拖出木箱可把拼塊取回待放區；復原本身也會計算一步。</li>
        <li>提示只高亮拼塊與建議區域，不會直接替你放置。</li>
